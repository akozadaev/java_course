plugins { id 'com.android.application' }
def localSettings = new Properties()
def localSettingsFile = rootProject.file('local.properties')
if (localSettingsFile.exists()) {
    localSettingsFile.withInputStream { localSettings.load(it) }
}
def rapidApiKey = localSettings.getProperty('rapidapi.key', '')
android { namespace 'ru.akozadaev.library'; compileSdk 35;
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'RAPIDAPI_KEY', groovy.json.JsonOutput.toJson(rapidApiKey)
    }
    defaultConfig { applicationId 'ru.akozadaev.library'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' };
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
dependencies { implementation 'androidx.appcompat:appcompat:1.7.0';
    implementation 'androidx.recyclerview:recyclerview:1.3.2';
    implementation 'com.squareup.retrofit2:retrofit:2.11.0';
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0' }
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
